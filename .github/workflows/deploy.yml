name: CI/CD Pipeline - Tienda de Perritos EFT

# El pipeline solo se ejecuta cuando se hace un push a la rama main (entrega final)
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el código del repositorio en el servidor de GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Configurar las credenciales de AWS Academy (Usa el Token temporal)
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    # 3. Autenticar Docker con Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 4. Compilar y subir la imagen del Backend a ECR (Usando la variable del login)
    - name: Build and Push Backend Image
      run: |
        docker build -t 696089101526.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:latest ./backend
        docker push 696089101526.dkr.ecr.us-east-1.amazonaws.com/tienda-backend:latest

    # 5. Compilar y subir la imagen del Frontend a ECR
    - name: Build and Push Frontend Image
      run: |
        docker build -t 696089101526.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:latest ./frontend
        docker push 696089101526.dkr.ecr.us-east-1.amazonaws.com/tienda-frontend:latest

    # 6. Configurar herramientas de Kubernetes (kubectl)
    - name: Setup Kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.35.4'

    # 7. Conectarse al clúster de AWS Academy
    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region us-east-1 --name tienda-cluster

    # 8. Desplegar los archivos YAML modificados en el clúster
    - name: Deploy to EKS
      run: |
        kubectl apply -f k8s/mysql-db.yaml
        kubectl apply -f k8s/backend.yaml
        kubectl apply -f k8s/frontend.yaml
        kubectl apply -f k8s/hpa.yaml

    # 9. Forzar a Kubernetes a refrescar los contenedores con las nuevas imágenes
    - name: Force Rollout Restart
      run: |
        kubectl rollout restart deployment/backend
        kubectl rollout restart deployment/frontend